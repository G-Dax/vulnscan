name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install packager
        run: python -m pip install pyinstaller
      - name: Build Guardian.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Guardian guardian_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: Guardian-Windows
          path: dist/Guardian.exe

